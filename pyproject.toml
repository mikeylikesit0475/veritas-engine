[project]
name = "veritas-engine"
version = "0.0.0"
description = "Adversarial fact-checking engine on Google ADK. Portfolio proof-of-concept."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael F" }]
# Sprint 0.2: ADK + LiteLLM (Ollama bridge). Pinned per ADR-001 — upstream API
# changes are wrapped at the veritas/graph boundary.
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.140.13",
    "google-adk[extensions]>=2.5.0,<3",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veritas"]

# --- ruff: gate, not suggestion ---
[tool.ruff]
line-length = 99
target-version = "py311"
src = ["veritas", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
# ADR-005: control flow is auditable. We don't need a docstring on every Python
# node — but we do want unused imports and shadowed names flagged.
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["veritas"]

[tool.ruff.format]
quote-style = "double"

# --- mypy: strict, gate not suggestion ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_explicit = false
# ADK types are wrapped at the veritas/graph boundary (ADR-001). Upstream
# untyped imports should surface, not be silently allowed.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
# No silent Any on generics.
disallow_any_generics = true

# --- pytest ---
[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "graph: stub-model graph traversal tests (ARCH §9)",
    "injection: prompt-injection regression tests (ADR-006)",
    "citation: citation validator tests (ARCH §5)",
    "eval: benchmark eval tests replaying fixtures (ARCH §6)",
]
